<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectrum Lab with Alex</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<style>
:root{
  --ink:#33331f; --card:#fffbe8; --card-line:rgba(120,90,20,.18);
  --locked:#d8d8d2; --locked-line:rgba(80,80,70,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);
  min-height:100vh;transition:background 1s}
body.landing{background:linear-gradient(135deg,#ffb054 0%,#ffd08a 28%,#cfe8b0 62%,#58b183 100%)}
body.g3{background:linear-gradient(165deg,#ffe9c2 0%,#ffc46b 35%,#ff9a3d 75%,#f07b1d 100%)}
body.g7{background:linear-gradient(165deg,#eef7d8 0%,#c4e6a5 35%,#79c58f 75%,#3f9d6e 100%)}

#app{max-width:1000px;margin:0 auto;padding:26px 16px 70px}

/* ---------- landing ---------- */
.pick{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:34px;text-align:center}
.pick h1{font-size:clamp(1.7em,5vw,2.5em);color:#3a3a22;text-shadow:0 2px 0 rgba(255,255,255,.4);letter-spacing:.5px;max-width:800px}
.pick .sub{font-size:1.02em;color:rgba(40,40,25,.75);margin-top:-24px;max-width:640px;line-height:1.5}
.who{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.who button{font-family:inherit;cursor:pointer;color:#fff;border:none;border-radius:26px;
  padding:24px 40px;box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .15s, box-shadow .15s;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:250px}
.who button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 34px rgba(0,0,0,.28)}
.who button:active{transform:scale(.97)}
#btn-g3{background:linear-gradient(160deg,#ff9a3d,#e8641c)}
#g7,#btn-g7{background:linear-gradient(160deg,#5cb883,#237a4e)}
.who .big{font-size:clamp(1.2em,3.5vw,1.6em);font-weight:900;letter-spacing:1.5px}
.who .small{font-size:.72em;font-weight:600;opacity:.85;letter-spacing:.5px}
.tip{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:.74em;
  color:rgba(40,40,25,.7);background:rgba(255,255,255,.55);padding:6px 14px;border-radius:99px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- grade view ---------- */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.back{font-family:inherit;font-size:.9em;font-weight:700;border:none;cursor:pointer;
  background:rgba(255,255,255,.75);color:var(--ink);padding:9px 16px;border-radius:99px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);transition:transform .12s}
.back:hover{transform:translateX(-2px)}
.kid-title{font-size:clamp(1.3em,4vw,1.9em);font-weight:900;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.25)}
.kid-sub{color:rgba(35,45,30,.85);text-shadow:0 1px 0 rgba(255,255,255,.45);margin:2px 0 14px;font-size:.93em;font-weight:600}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sortbtn{font-family:inherit;font-size:.8em;font-weight:800;border:none;cursor:pointer;
  background:rgba(255,255,255,.8);color:var(--ink);padding:8px 14px;border-radius:99px;
  box-shadow:0 3px 8px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:inherit;font-size:.72em;font-weight:800;letter-spacing:.4px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.45);color:#3c3c24;
  padding:5px 12px;border-radius:99px;transition:all .12s}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.18);border-color:#fff}
.chip .c{opacity:.55;font-weight:700}

.list{display:flex;flex-direction:column;gap:12px}
.lesson{background:var(--card);border:1.5px solid var(--card-line);border-radius:18px;
  box-shadow:0 4px 14px rgba(60,40,0,.10);overflow:hidden;transition:box-shadow .2s}
.lesson:not(.locked):hover{box-shadow:0 8px 24px rgba(60,40,0,.18)}
.lesson.locked{background:var(--locked);border-color:var(--locked-line);box-shadow:none}
.l-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
.l-num{flex:none;font-size:.72em;font-weight:900;letter-spacing:1px;color:#fff;border-radius:99px;padding:4px 10px}
body.g7 .l-num{background:#2e7d52}
body.g3 .l-num{background:#d96c12}
.lesson.locked .l-num{background:#9a9a92}
.l-title{font-weight:800;font-size:1.02em;line-height:1.3;flex:1;min-width:180px}
.l-date{flex:none;font-size:.76em;color:#7a6a3a;background:rgba(255,255,255,.65);padding:3px 10px;border-radius:99px}
.lesson.locked .l-date{background:rgba(255,255,255,.4);color:#77776e}
.l-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.62em;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.7);color:#6b5a28;border:1px solid rgba(120,90,20,.15)}
.lesson.locked .tag{background:rgba(255,255,255,.35);color:#7c7c74;border-color:rgba(80,80,70,.12)}
.l-caret{flex:none;font-size:.8em;color:#a08c50;transition:transform .25s}
.lesson.locked .l-caret{color:#8f8f88}
.lesson.open .l-caret{transform:rotate(90deg)}
.l-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.l-body-in{padding:2px 16px 16px}
.l-desc{font-size:.9em;line-height:1.55;color:#5a4d28;margin-bottom:12px}
.lesson.locked .l-desc{color:#6f6f66}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--card-line);
  border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);transition:transform .12s, box-shadow .12s}
.act:hover{transform:translateX(3px);box-shadow:0 4px 12px rgba(60,40,0,.14)}
.act .a-emoji{font-size:1.2em;flex:none}
.act .a-txt{flex:1;min-width:0;font-weight:700;font-size:.87em;line-height:1.3}
.act .a-go{flex:none;font-size:.76em;font-weight:900;letter-spacing:.5px;white-space:nowrap;
  padding:8px 13px;border-radius:99px;color:#fff}
body.g7 .a-go{background:#2e7d52}
body.g3 .a-go{background:#d96c12}
.nolinks{font-size:.82em;color:#8a7a48;font-style:italic}
.soon{display:inline-block;font-size:.8em;font-weight:800;color:#8a8a82;background:rgba(255,255,255,.5);
  padding:8px 14px;border-radius:99px}
footer{margin-top:26px;text-align:center;font-size:.72em;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.2);line-height:1.6}
</style>
</head>

const DATA = {"g3":{"label":"Spectrum Science G3","cls":"Mark's class","emoji":"🦊","lessons":[{"n":1,"t":"Milky Way","d":"17 Mar 2025","desc":"A journey from our Solar System out to the Milky Way and the vast universe beyond — learning just how small we really are.","tags":["Space"],"links":[],"future":false},{"n":2,"t":"Hot Colours","d":"22 Mar 2025","desc":"Why desert people wear long loose robes, and how the colour of your clothes changes the heat you absorb.","tags":["Physics"],"links":[],"future":false},{"n":3,"t":"The Sound of Food","d":"10 Apr 2025","desc":"How sound changes the way food tastes — and the story of Pavlov's dogs and their famous bells.","tags":["Biology"],"links":[],"future":false},{"n":4,"t":"Treetop Homes","d":"21 Apr 2025","desc":"Birds as architects: nests of mud, spit, sticks and spider silk, and the engineering tricks behind them.","tags":["Biology"],"links":[],"future":false},{"n":5,"t":"Getting to the Bottom of Things","d":"28 Apr 2025","desc":"Everything is made of atoms — we opened up the periodic table and zoomed in on the building blocks of matter.","tags":["Chemistry"],"links":[{"l":"Ptable — interactive periodic table","u":"https://ptable.com/","k":"sim"},{"l":"Scale of the Universe — size explorer","u":"https://scaleofuniverse.com/en","k":"sim"}],"future":false},{"n":6,"t":"Conductors, Insulators and You","d":"5 May 2025","desc":"Electricity, circuits and how not to get zapped — the science of what lets current through and what stops it.","tags":["Physics"],"links":[{"l":"Science Kids — circuits & conductors game","u":"https://www.sciencekids.co.nz/gamesactivities/circuitsconductors.html","k":"sim"},{"l":"Wordwall — insulators and conductors game","u":"https://wordwall.net/resource/4590445/insulators-and-conductors","k":"sim"}],"future":false},{"n":7,"t":"Which Way is the North?","d":"12 May 2025","desc":"How compasses, magnets and ancient navigators find the way when there are no roads.","tags":["Earth Science","Technology"],"links":[],"future":false},{"n":8,"t":"Colours in the Sky","d":"19 May 2025","desc":"Rainbows, prisms and why the sky plays with light — reflection, refraction and absorption.","tags":["Physics"],"links":[{"l":"Ray Optics Simulator","u":"https://phydemo.app/ray-optics/simulator/","k":"sim"}],"future":false},{"n":9,"t":"Power in a Little Package","d":"23 May 2025","desc":"Batteries, voltage, current and resistance — a shocking amount of physics in one little lemon.","tags":["Physics"],"links":[],"future":false},{"n":10,"t":"Molecules on the Move","d":"9 Jun 2025","desc":"Solids, liquids and gases: what molecules are doing when you heat them, cool them and squeeze them.","tags":["Physics","Chemistry"],"links":[{"l":"Javalab — States of Matter","u":"https://javalab.org/en/status_solid_liquid_gas_en/","k":"sim"},{"l":"PhET — States of Matter: Basics","u":"https://phet.colorado.edu/sims/html/states-of-matter-basics/latest/states-of-matter-basics_en.html","k":"sim"}],"future":false},{"n":11,"t":"Making Life Easier","d":"4 Aug 2025","desc":"Simple machines and the inclined plane — how a ramp turns a hard job into an easy one.","tags":["Physics","Engineering"],"links":[{"l":"PhET — Ramp: Forces and Motion","u":"https://phet.colorado.edu/sims/cheerpj/motion-series/latest/motion-series.html?simulation=ramp-forces-and-motion","k":"sim"},{"l":"Simple machines video","u":"https://www.youtube.com/watch?v=AX2zY3k4wcg","k":"video"}],"future":false},{"n":12,"t":"It All Starts with a Seed","d":"11 Aug 2025","desc":"Plant life cycles and the sneaky ways seeds travel — by wind, water, hooks and explosions.","tags":["Biology"],"links":[{"l":"Seed dispersal video","u":"https://www.youtube.com/watch?v=tkFPyue5X3Q","k":"video"}],"future":false},{"n":13,"t":"The Leaf — Nature's Green Machine","d":"18 Aug 2025","desc":"Photosynthesis — how leaves turn sunlight, water and air into food for the whole plant.","tags":["Biology","Chemistry"],"links":[{"l":"Photosynthesis Lab","u":"https://leosiiman.neocities.org/lab-rate-of-photosynthesis/photolab-individual","k":"sim"}],"future":false},{"n":14,"t":"Reptile or Amphibian","d":"25 Aug 2025","desc":"Scales or slime? Eggs in water or on land? Comparing two famous animal groups on the tree of life.","tags":["Biology"],"links":[{"l":"OneZoom — Tree of Life Explorer","u":"https://www.onezoom.org/","k":"sim"}],"future":false},{"n":15,"t":"Life in the Extreme + Cannibals","d":"1 Sep 2025","desc":"Surviving the Arctic: blubber, antifreeze blood, and the animals that eat their own kind to make it through winter.","tags":["Biology","Environment"],"links":[],"future":false},{"n":16,"t":"Community Life","d":"21 Aug 2026","desc":"How animals live together in communities — from ant colonies to cities of their own making.","tags":["Biology"],"links":[],"future":false},{"n":17,"t":"An Underwater World","d":"22 Sep 2025","desc":"Coral reefs and the strangest roommates in nature — clownfish, anemones and the art of symbiosis.","tags":["Biology","Environment"],"links":[{"l":"Underwater world video","u":"https://www.youtube.com/watch?v=PDJXgxHs7Ak","k":"video"}],"future":false},{"n":18,"t":"Decomposers","d":"6 Oct 2025","desc":"Nature's stomach: fungi, worms and bacteria that break down the dead and recycle everything.","tags":["Biology","Environment"],"links":[{"l":"Decomposers video","u":"https://www.youtube.com/watch?v=KI7u_pcfAQE","k":"video"}],"future":false},{"n":19,"t":"Fossils + Review","d":"13 Oct 2025","desc":"How a dead thing becomes a fossil — burial, amber, ice, tar pits and mineral replacement.","tags":["Earth Science","Biology"],"links":[{"l":"Layers of Time — fossil layers game","u":"https://www.amnh.org/explore/ology/paleontology/layers-of-time2","k":"sim"},{"l":"Fossils video","u":"https://www.youtube.com/watch?v=5RyAkY-8J9A","k":"video"}],"future":false},{"n":20,"t":"Anatomy","d":"20 Oct 2025","desc":"A tour of the human body — every system that keeps you running without asking permission.","tags":["Biology","Medicine"],"links":[{"l":"Innerbody — Human Anatomy Explorer","u":"https://www.innerbody.com/htm/body.html","k":"sim"}],"future":false},{"n":21,"t":"The Shapes of the Land","d":"27 Oct 2025","desc":"How erosion, rivers and moving plates carve canyons, valleys and mountains over millions of years.","tags":["Earth Science"],"links":[{"l":"Visible Geology — 3D Earth models","u":"https://www.visiblegeology.com/","k":"sim"},{"l":"Google Earth","u":"https://earth.google.com/web/","k":"web"}],"future":false},{"n":22,"t":"The Pull of the Moon + Intertidal Zone","d":"3 Nov 2025","desc":"Why the ocean rises and falls twice a day — and the tough creatures trapped in between.","tags":["Earth Science","Space","Biology"],"links":[{"l":"Tide-pool tour","u":"https://prezi.com/view/Xfl9XHaKnu6TkWti6jsf/","k":"web"},{"l":"Intertidal habitat games","u":"https://laharborhabitats.org/play-games/","k":"sim"}],"future":false},{"n":23,"t":"Tough Stuff","d":"17 Nov 2025","desc":"Mineral hardness and the Mohs scale — from talc you can crush with a fingernail to diamond that scratches everything.","tags":["Earth Science","Chemistry"],"links":[{"l":"Mohs Hardness Scale — 3D mineral collection","u":"https://sketchfab.com/MineralogyPetrographyMuseum/collections/mohs-hardness-scale-96011c2f72994eb887051","k":"web"},{"l":"AMNH — mineral guide","u":"https://www.amnh.org/explore/ology/earth/the-amazing-mundo","k":"web"},{"l":"The Mohs scale, explained","u":"https://miamiminingco.com/2022/05/11/the-mineral-hardness-scale-the-mohs-scale/","k":"web"}],"future":false},{"n":24,"t":"There's Electricity in the Air","d":"17 Nov 2025","desc":"Static electricity, lightning and storm safety — what happens when too many electrons jump ship at once.","tags":["Physics"],"links":[{"l":"PhET — Balloons and Static Electricity","u":"https://phet.colorado.edu/sims/html/balloons-and-static-electricity/latest/balloons-and-static-electricity_en.html","k":"sim"}],"future":false},{"n":25,"t":"Geological Ages and Ice Age","d": ch?v=CcUhVCMAhAI","k":"video"},{"l":"Exoplanets video 3","u":"https://www.youtube.com/watch?v=4IXYp9Fse44","k":"video"}],"future":false},{"n":31,"t":"Rocks from Space","d":"5 Dec 2025","desc":"Meteorites — pieces of other worlds that fall into ours, and what they tell us about the solar system.","tags":["Space","Earth Science"],"links":[],"future":false},{"n":32,"t":"The Speedy Planet","d":"22 Dec 2025","desc":"Mercury, the fastest planet — a year in 88 days, and temperature swings of 600 degrees.","tags":["Space"],"links":[{"l":"Solar System Scope","u":"https://www.solarsystemscope.com/","k":"sim"},{"l":"Mercury information","u":"https://skymarvels.com/infopages/mercuryinfo.htm","k":"web"},{"l":"Stellarium Web — the live sky","u":"https://stellarium-web.org/","k":"sim"}],"future":false},{"n":33,"t":"A Watery Problem","d":"23 Feb 2026","desc":"Water pressure, flow and irrigation — how humans move water uphill without pumps.","tags":["Physics","Engineering"],"links":[],"future":false},{"n":34,"t":"Seeing the Stars","d":"9 Mar 2026","desc":"Telescopes and the physics of seeing far — bending light to catch ancient photons.","tags":["Space","Physics"],"links":[{"l":"PhET — Bending Light","u":"https://phet.colorado.edu/en/simulations/bending-light","k":"sim"},{"l":"PhET — Geometric Optics","u":"https://phet.colorado.edu/en/simulations/geometric-optics","k":"sim"},{"l":"Optics video","u":"https://www.youtube.com/watch?v=i7930fj3T54","k":"video"},{"l":"Hubble Extreme Deep Field","u":"https://science.nasa.gov/asset/hubble/hubble-extreme-deep-field-xdf/","k":"web"}],"future":false},{"n":35,"t":"Keeping Pace","d":"16 Mar 2026","desc":"The heart's electrical system — how a natural pacemaker keeps you ticking, and what happens when it skips.","tags":["Biology","Medicine"],"links":[{"l":"Heartbeat sound effect","u":"https://elevenlabs.io/sound-effects/heartbeat","k":"web"},{"l":"How the heart works — video","u":"https://www.youtube.com/watch?v=a-uF50BgMGM","k":"video"},{"l":"MSD const ICONS = {ours:'🎮', sim:'🔬', video:'🎬', web:'🌐'};
const app = document.getElementById('app');
let sortDesc = true;
let activeTags = new Set();

function renderLanding(){
  document.body.className = 'landing';
  activeTags.clear();
  app.innerHTML = `
    <div class="pick">
      <h1>🔬 Spectrum Science with Alex</h1>
      <div class="sub">An interactive science curriculum — 110 lessons of games, simulations, experiments and videos. Pick your grade to explore everything we've learned.</div>
      <div class="who">
        <button id="btn-g3" onclick="go('g3')"><span class="big">Spectrum Science G3</span><span class="small">Grade 3 · 🦊 Mark's class</span></button>
        <button id="btn-g7" onclick="go('g7')"><span class="big">Spectrum Science G7</span><span class="small">Grade 7 · 🐼 Ming's class</span></button>
      </div>
    </div>
    <div class="tip">💡 If a link opened inside WeChat: tap ··· (top right) → Open in Browser.</div>`;
}

function go(kid){
  const K = DATA[kid];
  document.body.className = kid;
  const allTags = [...new Set(K.lessons.flatMap(L=>L.tags))].sort();
  const counts = {};
  K.lessons.forEach(L=>L.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  app.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="renderLanding()">← All grades</button>
      <div class="kid-title">${K.emoji} ${K.label}</div>
    </div>
    <div class="kid-sub">${K.cls} · ${K.lessons.length} lessons · tap a lesson to see what it was about and try its interactives</div>
    <div class="controls">
      <button class="sortbtn" onclick="toggleSort()">Order: <span id="sortlab">${sortDesc?'newest first ↓':'oldest first ↑'}</span></button>
    </div>
    <div class="chips" id="chips">
      <span style="font-size:.74em;font-weight:800;align-self:center;color:rgba(35,45,30,.8)">FILTER:</span>
      ${allTags.map(t=>`<button class="chip" data-tag="${t}" onclick="toggleTag('${t}')">${t} <span class="c">${counts[t]}</span></button>`).join('')}
    </div>
    <div class="list" id="list"></div>
    <footer>${K.lessons.filter(l=>!l.future).length} lessons taught · ${K.lessons.reduce((s,l)=>s+l.links.length,0)} links · built with 🧪 by Alex</footer>`;
  renderList(kid);
  window.scrollTo(0,0);
}

function toggleSort(){ sortDesc = !sortDesc; document.getElementById('sortlab').textContent = sortDesc?'newest first ↓':'oldest first ↑'; renderList(currentKid); }
function toggleTag(t){
  activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', activeTags.has(c.dataset.tag)));
  renderList(currentKid);
}

let currentKid = null;
function renderList(kid){
  currentKid = kid;
  const K = DATA[kid];
  let rows = [...K.lessons];
  if (activeTags.size) rows = rows.filter(L=>L.tags.some(t=>activeTags.has(t)));
  rows.sort((a,b)=> sortDesc ? b.n-a.n : a.n-b.n);
  document.getElementById('list').innerHTML = rows.map(L=>{
    const i = K.lessons.indexOf(L);
    return `
    <div class="lesson ${L.future?'locked':''}" id="ls-${i}">
      <div class="l-head" onclick="toggle(${i})">
        <span class="l-num">LESSON ${L.n}</span>
        <span class="l-title">${L.t}</span>
        <span class="l-tags">${L.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span>
        <span class="l-date">${L.future?'coming soon':L.d}</span>
        <span class="l-caret">▶</span>
      </div>
      <div class="l-body"><div class="l-body-in">
        <div class="l-desc">${L.desc}</div>
        <div class="acts">
          ${L.future ? `<span class="soon">🔒 Coming soon — not taught yet!</span>`
            : L.links.length ? L.links.map(a=>`
              <a class="act" href="${a.u}" target="_blank" rel="noopener">
                <span class="a-emoji">${ICONS[a.k]}</span>
                <span class="a-txt">${a.l}</span>
                <span class="a-go">GO ▶</span>
              </a>`).join('')
            : `<span class="nolinks">This lesson was games and discussion in class — no online activities, but ask Alex to show you the materials!</span>`}
        </div>
      </div></div>
    </div>`;
  }).join('') || `<div style="text-align:center;color:#fff;font-weight:700;padding:30px">No lessons match those tags — tap a tag to un-filter.</div>`;
}

function toggle(i){
  const el = document.getElementById('ls-'+i);
  if(!el) return;
  const body = el.querySelector('.l-body');
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.lesson.open').forEach(o=>{
    o.classList.remove('open');
    o.querySelector('.l-body').style.maxHeight = '0';
  });
  if(!wasOpen){
    el.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
    setTimeout(()=>{ if(el.classList.contains('open')) body.style.maxHeight = 'none'; }, 380);
  }
}

renderLanding();
</script>
