<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spectrum Science with Alex</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<style>
:root{
  --ink:#33331f; --card:#fffbe8; --card-line:rgba(120,90,20,.18);
  --locked:#d8d8d2; --locked-line:rgba(80,80,70,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);
  min-height:100vh;transition:background 1s}
body.landing{background:linear-gradient(135deg,#ffb054 0%,#ffd08a 28%,#cfe8b0 62%,#58b183 100%)}
body.g3{background:linear-gradient(165deg,#ffe9c2 0%,#ffc46b 35%,#ff9a3d 75%,#f07b1d 100%)}
body.g7{background:linear-gradient(165deg,#eef7d8 0%,#c4e6a5 35%,#79c58f 75%,#3f9d6e 100%)}

#app{max-width:1000px;margin:0 auto;padding:26px 16px 70px}

/* ---------- landing ---------- */
.pick{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:34px;text-align:center}
.pick h1{font-size:clamp(1.7em,5vw,2.5em);color:#3a3a22;text-shadow:0 2px 0 rgba(255,255,255,.4);letter-spacing:.5px;max-width:800px}
.pick .sub{font-size:1.02em;color:rgba(40,40,25,.75);margin-top:-24px;max-width:640px;line-height:1.5}
.who{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.who button{font-family:inherit;cursor:pointer;color:#fff;border:none;border-radius:26px;
  padding:24px 40px;box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .15s, box-shadow .15s;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:250px}
.who button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 34px rgba(0,0,0,.28)}
.who button:active{transform:scale(.97)}
#btn-g3{background:linear-gradient(160deg,#ff9a3d,#e8641c)}
#btn-g7{background:linear-gradient(160deg,#5cb883,#237a4e)}
.who .big{font-size:clamp(1.2em,3.5vw,1.6em);font-weight:900;letter-spacing:1.5px}
.who .small{font-size:1em;font-weight:600;opacity:.85;letter-spacing:.5px}
.tip{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:.74em;
  color:rgba(40,40,25,.7);background:rgba(255,255,255,.55);padding:6px 14px;border-radius:99px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- grade view ---------- */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.back{font-family:inherit;font-size:.9em;font-weight:700;border:none;cursor:pointer;
  background:rgba(255,255,255,.75);color:var(--ink);padding:9px 16px;border-radius:99px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);transition:transform .12s}
.back:hover{transform:translateX(-2px)}
.kid-title{font-size:clamp(1.3em,4vw,1.9em);font-weight:900;letter-spacing:2px;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.25)}
.kid-sub{color:rgba(35,45,30,.85);text-shadow:0 1px 0 rgba(255,255,255,.45);margin:2px 0 14px;font-size:.93em;font-weight:600}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sortbtn{font-family:inherit;font-size:.8em;font-weight:800;border:none;cursor:pointer;
  background:rgba(255,255,255,.8);color:var(--ink);padding:8px 14px;border-radius:99px;
  box-shadow:0 3px 8px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:inherit;font-size:.72em;font-weight:800;letter-spacing:.4px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.45);color:#3c3c24;
  padding:5px 12px;border-radius:99px;transition:all .12s}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.18);border-color:#fff}
.chip .c{opacity:.55;font-weight:700}

.list{display:flex;flex-direction:column;gap:12px}
.lesson{background:var(--card);border:1.5px solid var(--card-line);border-radius:18px;
  box-shadow:0 4px 14px rgba(60,40,0,.10);overflow:hidden;transition:box-shadow .2s}
.lesson:not(.locked):hover{box-shadow:0 8px 24px rgba(60,40,0,.18)}
.lesson.locked{background:var(--locked);border-color:var(--locked-line);box-shadow:none}
.l-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
.l-num{flex:none;font-size:.72em;font-weight:900;letter-spacing:1px;color:#fff;border-radius:99px;padding:4px 10px}
body.g7 .l-num{background:#2e7d52}
body.g3 .l-num{background:#d96c12}
.lesson.locked .l-num{background:#9a9a92}
.l-title{font-weight:800;font-size:1.02em;line-height:1.3;flex:1;min-width:180px}
.l-date{flex:none;font-size:.76em;color:#7a6a3a;background:rgba(255,255,255,.65);padding:3px 10px;border-radius:99px}
.lesson.locked .l-date{background:rgba(255,255,255,.4);color:#77776e}
.l-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.62em;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.7);color:#6b5a28;border:1px solid rgba(120,90,20,.15)}
.lesson.locked .tag{background:rgba(255,255,255,.35);color:#7c7c74;border-color:rgba(80,80,70,.12)}
.l-caret{flex:none;font-size:.8em;color:#a08c50;transition:transform .25s}
.lesson.locked .l-caret{color:#8f8f88}
.lesson.open .l-caret{transform:rotate(90deg)}
.l-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.l-body-in{padding:2px 16px 16px}
.l-desc{font-size:.9em;line-height:1.55;color:#5a4d28;margin-bottom:12px}
.lesson.locked .l-desc{color:#6f6f66}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--card-line);
  border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);transition:transform .12s, box-shadow .12s}
.act:hover{transform:translateX(3px);box-shadow:0 4px 12px rgba(60,40,0,.14)}
.act .a-emoji{font-size:1.2em;flex:none}
.act .a-txt{flex:1;min-width:0;font-weight:700;font-size:.87em;line-height:1.3}
.act .a-go{flex:none;font-size:.72em;font-weight:900;letter-spacing:.5px;white-space:nowrap;
  padding:8px 13px;border-radius:99px;color:#fff}
body.g7 .a-go{background:#2e7d52}
body.g3 .a-go{background:#d96c12}
.nolinks{font-size:.82em;color:#8a7a48;font-style:italic}
.soon{display:inline-block;font-size:.8em;font-weight:800;color:#8a8a82;background:rgba(255,255,255,.5);
  padding:8px 14px;border-radius:99px}
footer{margin-top:26px;text-align:center;font-size:.72em;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.2);line-height:1.6}
</style>
</head>

UhVCMAhAI","k":"video"},{"l":"Exoplanets video 3","u":"https://www.youtube.com/watch?v=4IXYp9Fse44","k":"video"},{"l":"NASA Eyes on Exoplanets","u":"https://eyes.nasa.gov/apps/exo/#/","k":"sim"},{"l":"NASA Exoplanet Travel Bureau","u":"https://exoplanets.nasa.gov/alien-worlds/exoplanet-travel-bureau/","k":"sim"},{"l":"Exoatmospheres Explorer","u":"https://research.iac.es/proyecto/exoatmospheres/","k":"sim"}],"future":false},{"n":31,"sk":31.0,"t":"Rocks from Space","d":"5 Dec 2025","desc":"Meteorites — pieces of other worlds that fall into ours, and what they tell us about the solar system.","tags":["Space","Earth Science"],"links":[],"future":false},{"n":32,"sk":32.0,"t":"The Speedy Planet","d":"22 Dec 2025","desc":"Mercury, the fastest planet — a year in 88 days, and temperature swings of 600 degrees.","tags":["Space"],"links":[{"l":"Mercury information","u":"https://skymarvels.com/infopages/mercuryinfo.htm","k":"web"},{"l":"Solar System Scope","u":"https://www.solarsystemscope.com/","k":"sim"},{"l":"Stellarium Web — the live sky","u":"https://stellarium-web.org/","k":"sim"}],"future":false},{"n":33,"sk":33.0,"t":"A Watery Problem","d":"23 Feb 2026","desc":"Water pressure, flow and irrigation — how humans move water uphill without pumps.","tags":["Physics","Engineering"],"links":[],"future":false},{"n":34,"sk":34.0,"t":"Seeing the Stars","d":"9 Mar 2026","desc":"Telescopes and the physics of seeing far — bending light to catch ancient photons.","tags":["Space","Physics"],"links":[{"l":"Optics video","u":"https://www.youtube.com/watch?v=i7930fj3T54","k":"video"},{"l":"Hubble Extreme Deep Field","u":"https://science.nasa.gov/asset/hubble/hubble-extreme-deep-field-xdf/","k":"web"},{"l":"PhET — Bending Light","u":"https://phet.colorado.edu/en/simulations/bending-light","k":"sim"},{"l":"PhET — Geometric Optics","u":"https://phet.colorado.edu/en/simulations/geometric-optics","k":"sim"}],"future":false},{"n":35,"sk":35.0,"t":"Keeping Pace","d":"16 Mar 2026","desc":"The he const ICONS = {ours:'🎮', sim:'🔬', video:'🎬', web:'📖', mat:'📖'};
const GO = {video:'WATCH ▶', web:'CHECK IT OUT ▶', mat:'CHECK IT OUT ▶', sim:'EXPLORE ▶', ours:'EXPLORE ▶'};
const app = document.getElementById('app');
let sortDesc = true;
let activeTags = new Set();

function renderLanding(){
  document.body.className = 'landing';
  activeTags.clear();
  app.innerHTML = `
    <div class="pick">
      <h1>🔬 Spectrum Science with Alex</h1>
      <div class="sub">An interactive science curriculum — games, simulations, experiments and videos. Pick your grade to explore everything we've learned.</div>
      <div class="who">
        <button id="btn-g3" onclick="go('g3')"><span class="big">Spectrum Science G3</span><span class="small">Grade 3&4 · 🦆 Mark's class</span></button>
        <button id="btn-g7" onclick="go('g7')"><span class="big">Spectrum Science G7</span><span class="small">Grade 7&8 · 🐻‍❄️ Ming's class</span></button>
      </div>
    </div>
    <div class="tip">💡 If a link opened inside WeChat: tap ··· (top right) → Open in Browser.</div>`;
}

function go(kid){
  const K = DATA[kid];
  document.body.className = kid;
  const allTags = [...new Set(K.lessons.flatMap(L=>L.tags))].sort();
  const counts = {};
  K.lessons.forEach(L=>L.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  app.innerHTML = `
    <div class="topbar">
      <button class="back" onclick="renderLanding()">← All grades</button>
      <div class="kid-title">${K.emoji} ${K.label}</div>
    </div>
    <div class="kid-sub">${K.cls} · ${K.lessons.length} lessons · tap a lesson to see what it was about and try its activities</div>
    <div class="controls">
      <button class="sortbtn" onclick="toggleSort()">Order: <span id="sortlab">${sortDesc?'newest first ↓':'oldest first ↑'}</span></button>
    </div>
    <div class="chips" id="chips">
      <span style="font-size:.74em;font-weight:800;align-self:center;color:rgba(35,45,30,.8)">FILTER:</span>
      ${allTags.map(t=>`<button class="chip" data-tag="${t}" onclick="toggleTag('${t}')">${t} <span class="c">${counts[t]}</span></button>`).join('')}
    </div>
    <div class="list" id="list"></div>
    <footer>${K.lessons.filter(l=>!l.future).length} lessons taught · ${K.lessons.reduce((s,l)=>s+l.links.length,0)} links · built with 🧪 by Alex</footer>`;
  renderList(kid);
  window.scrollTo(0,0);
}

function toggleSort(){ sortDesc = !sortDesc; document.getElementById('sortlab').textContent = sortDesc?'newest first ↓':'oldest first ↑'; renderList(currentKid); }
function toggleTag(t){
  activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', activeTags.has(c.dataset.tag)));
  renderList(currentKid);
}

let currentKid = null;
function renderList(kid){
  currentKid = kid;
  const K = DATA[kid];
  let rows = [...K.lessons];
  if (activeTags.size) rows = rows.filter(L=>L.tags.some(t=>activeTags.has(t)));
  rows.sort((a,b)=> sortDesc ? b.sk-a.sk : a.sk-b.sk);
  document.getElementById('list').innerHTML = rows.map(L=>{
    const i = K.lessons.indexOf(L);
    return `
    <div class="lesson ${L.future?'locked':''}" id="ls-${i}">
      <div class="l-head" onclick="toggle(${i})">
        <span class="l-num">${L.n==null?'REVIEW':'LESSON '+L.n}</span>
        <span class="l-title">${L.t}</span>
        <span class="l-tags">${L.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span>
        <span class="l-date">${L.future?'coming soon':L.d}</span>
        <span class="l-caret">▶</span>
      </div>
      <div class="l-body"><div class="l-body-in">
        <div class="l-desc">${L.desc}</div>
        <div class="acts">
          ${L.future ? `<span class="soon">🔒 Coming soon — not taught yet!</span>`
            : L.links.length ? L.links.map(a=>`
              <a class="act" href="${a.u}" target="_blank" rel="noopener">
                <span class="a-emoji">${ICONS[a.k]}</span>
                <span class="a-txt">${a.l}</span>
                <span class="a-go">${GO[a.k]}</span>
              </a>`).join('')
            : `<span class="nolinks">This lesson was games and discussion in class — no online activities, but ask Alex to show you the materials!</span>`}
        </div>
      </div></div>
    </div>`;
  }).join('') || `<div style="text-align:center;color:#fff;font-weight:700;padding:30px">No lessons match those tags — tap a tag to un-filter.</div>`;
}

function toggle(i){
  const el = document.getElementById('ls-'+i);
  if(!el) return;
  const body = el.querySelector('.l-body');
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.lesson.open').forEach(o=>{
    o.classList.remove('open');
    o.querySelector('.l-body').style.maxHeight = '0';
  });
  if(!wasOpen){
    el.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
    setTimeout(()=>{ if(el.classList.contains('open')) body.style.maxHeight = 'none'; }, 380);
  }
}

renderLanding();
</script>
</body>
</html>
