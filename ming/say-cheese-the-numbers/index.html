<!DOCTYPE html><html lang="en"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Numbers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:#0a1628;min-height:100vh;padding:20px;color:#e0e0e0}
.container{max-width:820px;margin:0 auto}
.header{text-align:center;margin-bottom:20px}
.header h1{font-family:'Merriweather',serif;font-size:1.4rem;color:#f7d794;margin-bottom:4px}
.header p{font-size:.85rem;color:#8a8aaa}
.game-area{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.col{flex:1;min-width:250px;display:flex;flex-direction:column;gap:10px}
.col-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:#7a7a9a;margin-bottom:4px;text-align:center}
.num-card{padding:16px;background:#1a2a4a;border:2px solid #2a3a5a;border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;user-select:none}
.num-card:hover{border-color:#f7d794;transform:translateY(-2px)}
.num-card.selected{border-color:#f7d794;background:#2a3a5a;box-shadow:0 0 12px rgba(247,215,148,.2)}
.num-card.matched{border-color:#2ecc71;background:rgba(46,204,113,.1);cursor:default;opacity:.85}
.num-card.matched:hover{transform:none}
.num-val{font-family:'Merriweather',serif;font-size:1.5rem;color:#f7d794;margin-bottom:4px}
.exp-card{padding:14px 16px;background:#1a2a4a;border:2px solid #2a3a5a;border-radius:10px;cursor:pointer;transition:all .2s;font-size:.85rem;line-height:1.5;color:#b0b0c0;user-select:none}
.exp-card:hover{border-color:#3498db;background:#1e2e4e}
.exp-card.selected{border-color:#3498db;background:#1e2e4e;box-shadow:0 0 12px rgba(52,152,219,.2)}
.exp-card.matched{border-color:#2ecc71;background:rgba(46,204,113,.1);cursor:default;opacity:.85}
.exp-card.matched:hover{transform:none}
.exp-card.wrong{animation:shake .4s ease;border-color:#e74c3c}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.score-bar{text-align:center;margin-top:16px;padding:12px;background:#1a2a4a;border-radius:8px;border:1px solid #2a3a5a;font-size:.9rem;color:#7a7a9a}
.score-bar.done{border-color:#2ecc71;color:#2ecc71;background:rgba(46,204,113,.08)}
.confetti-box{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;overflow:hidden}
@media(max-width:600px){.game-area{flex-direction:column}.num-val{font-size:1.2rem}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🦷 The Numbers</h1>
<p>Click a number, then click the fact it matches. How well do you know your mouth?</p>
</div>
<div class="game-area">
<div class="col">
<div class="col-label">Numbers</div>
<div id="numCol"></div>
</div>
<div class="col">
<div class="col-label">Facts</div>
<div id="expCol"></div>
</div>
</div>
<div class="score-bar" id="scoreBar">Matched: 0 / 6</div>
</div>
<div class="confetti-box" id="confettiBox"></div>
<script>
(function(){
var pairs=[
{num:"700+",exp:"Distinct microbial species that have been identified living in the human oral cavity — more diverse than your gut"},
{num:"20,000,000,000",exp:"Individual bacteria present in a single mouth at any given moment — and they double every time you skip brushing"},
{num:"6.8",exp:"The resting pH level of human saliva between meals — slightly below true chemical neutral (7.0)"},
{num:"5.5",exp:"The critical pH threshold below which hydroxyapatite crystals in your enamel begin to dissolve, ion by ion"},
{num:"96",exp:"The percentage of tooth enamel that is inorganic mineral crystal — making it the hardest biological substance in the human body"},
{num:"59,000",exp:"Age in years of the oldest known dental cavity — and the oldest evidence of dental treatment — found in a Neanderthal molar from Chagyrskaya Cave, Siberia"}
];
var nums=[],exps=[];
for(var i=0;i<pairs.length;i++){nums.push({id:i,val:pairs[i].num});exps.push({id:i,text:pairs[i].exp})}
// shuffle explanations
for(var j=exps.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=exps[j];exps[j]=exps[k];exps[k]=tmp}
var numCol=document.getElementById("numCol");
var expCol=document.getElementById("expCol");
for(var n=0;n<nums.length;n++){
var d=document.createElement("div");d.className="num-card";d.dataset.id=nums[n].id;
d.innerHTML='<div class="num-val">'+nums[n].val+'</div>';
numCol.appendChild(d);
}
for(var e=0;e<exps.length;e++){
var d2=document.createElement("div");d2.className="exp-card";d2.dataset.id=exps[e].id;
d2.textContent=exps[e].text;
expCol.appendChild(d2);
}
var selectedNum=null,matched=0,audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playTone(freq,dur,type){try{var ctx=getAudio();var o=ctx.createOscillator();var g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=type||"sine";o.frequency.value=freq;g.gain.value=.12;o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.stop(ctx.currentTime+dur)}catch(e){}}
function playCorrect(){playTone(523,.1);setTimeout(function(){playTone(659,.1)},100);setTimeout(function(){playTone(784,.15)},200)}
function playWrong(){playTone(200,.2,"square")}
numCol.addEventListener("click",function(ev){
var card=ev.target.closest(".num-card");
if(!card||card.classList.contains("matched"))return;
var prev=numCol.querySelector(".selected");
if(prev)prev.classList.remove("selected");
if(prev===card){selectedNum=null;return}
card.classList.add("selected");selectedNum=card;
});
expCol.addEventListener("click",function(ev){
var card=ev.target.closest(".exp-card");
if(!card||card.classList.contains("matched")||!selectedNum)return;
if(selectedNum.dataset.id===card.dataset.id){
selectedNum.classList.remove("selected");selectedNum.classList.add("matched");
card.classList.add("matched");matched++;selectedNum=null;
document.getElementById("scoreBar").textContent="Matched: "+matched+" / 6";
playCorrect();confetti();
if(matched===6){document.getElementById("scoreBar").textContent="🎉 All matched! You know your mouth!";document.getElementById("scoreBar").classList.add("done");setTimeout(confetti,300);setTimeout(confetti,600)}
}else{
card.classList.add("wrong");playWrong();
setTimeout(function(){card.classList.remove("wrong")},400);
}
});
function confetti(){var c=document.getElementById("confettiBox");var cols=["#f7d794","#2ecc71","#3498db","#e74c3c","#9b59b6","#e84393"];for(var i=0;i<25;i++){var p=document.createElement("div");p.style.cssText="position:absolute;width:"+(5+Math.random()*6)+"px;height:"+(5+Math.random()*6)+"px;background:"+cols[Math.floor(Math.random()*cols.length)]+";border-radius:"+(Math.random()>.5?"50%":"2px")+";left:"+Math.random()*100+"%;top:-10px;";var d=Math.random()*200-100;p.animate([{transform:"translateY(0) rotate(0deg)",opacity:1},{transform:"translateY("+(window.innerHeight+50)+"px) translateX("+d+"px) rotate("+(Math.random()*720)+"deg)",opacity:0}],{duration:1500+Math.random()*1000,easing:"cubic-bezier(.25,.46,.45,.94)"});c.appendChild(p);(function(el){setTimeout(function(){el.remove()},2500)})(p)}
}
})();
</script>


</body></html>
