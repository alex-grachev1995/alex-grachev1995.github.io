* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Roboto', sans-serif;
  background: #0a1628;
  min-height: 100vh;
  padding: 16px;
  color: #e0e0e0;
}

.container { max-width: 920px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-family: 'Merriweather', serif; font-size: 1.4rem; color: #f7d794; margin-bottom: 4px; }
.header .subtitle { font-size: 0.85rem; color: #8a8aaa; }

.level-select { display: flex; flex-direction: column; gap: 14px; }
.level-cards { display: flex; gap: 14px; flex-wrap: wrap; }
.level-card {
  flex: 1; min-width: 200px;
  background: #1a2a4a; border-radius: 14px; padding: 22px;
  border: 2px solid #2a3a5a; cursor: pointer; transition: all 0.25s;
}
.level-card:hover { border-color: #f7d794; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.level-card .lc-difficulty { font-size: 0.85rem; margin-bottom: 6px; }
.level-card h3 { font-family: 'Merriweather', serif; font-size: 1.1rem; color: #f0f0f0; margin-bottom: 4px; }
.level-card .lc-sub { font-size: 0.8rem; color: #f7d794; margin-bottom: 8px; }
.level-card p { font-size: 0.8rem; color: #8a8aaa; line-height: 1.5; }
.level-card .lc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.lc-tag { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; background: #2a3a5a; color: #b0b0c0; display: inline-block; }

#gameScreen { display: none; }

.level-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.back-btn {
  background: none; border: 1px solid #4a4a6a; color: #8a8aaa;
  padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
}
.back-btn:hover { border-color: #f7d794; color: #f7d794; }
.level-bar-title { font-family: 'Merriweather', serif; font-size: 1rem; color: #f0f0f0; }
.level-bar-diff { font-size: 0.8rem; color: #8a8aaa; margin-left: auto; }

.instructions-panel {
  background: #1a2a4a; border-radius: 10px; padding: 14px 18px;
  margin-bottom: 14px; border: 1px solid #2a3a5a;
  font-size: 0.8rem; line-height: 1.6; color: #b0b0c0;
}
.instructions-panel strong { color: #f7d794; }
.rules-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.rule-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; }

.game-layout { display: flex; gap: 14px; flex-wrap: wrap; }

.map-area {
  flex: 1; min-width: 320px; position: relative;
  background: #0b1a33; border-radius: 14px; border: 1px solid #2a3a5a;
  overflow: hidden; height: 0; padding-bottom: 75%;
}

.island {
  position: absolute; top: 5%; left: 5%; width: 90%; height: 90%;
  border: none;
}

.ocean-label { position: absolute; font-size: 0.65rem; color: #1a3a5a; font-style: italic; }

.mountain-shape {
  position: absolute; z-index: 3; pointer-events: none;
  background: linear-gradient(180deg, #6a5a4a 0%, #5a4a3a 50%, #4a3a2a 100%);
  border: 1px solid #5a4a3a; opacity: 0.9; border-radius: 4px;
}
.mountain-label {
  position: absolute; z-index: 4; pointer-events: none;
  font-size: 0.65rem; color: #c0a080; white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.restricted-zone {
  position: absolute; z-index: 2; pointer-events: none;
  border: 2px dashed rgba(231,76,60,0.4);
  background: rgba(231,76,60,0.04); border-radius: 10px;
}
.rz-label {
  position: absolute; top: 4px; left: 8px;
  font-size: 0.6rem; color: rgba(231,76,60,0.6); white-space: nowrap;
}

.tower {
  position: absolute; width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; cursor: pointer; transition: all 0.2s;
  z-index: 10; border: 3px solid #4a4a6a; background: #1e2a4a;
}
.tower:hover { transform: scale(1.15); box-shadow: 0 0 14px rgba(247,215,148,0.4); }
.tower.freq-a { border-color: #e74c3c; background: rgba(231,76,60,0.25); }
.tower.freq-b { border-color: #3498db; background: rgba(52,152,219,0.25); }
.tower.freq-c { border-color: #2ecc71; background: rgba(46,204,113,0.25); }
.tower.locked { cursor: not-allowed; }
.tower.locked:hover { transform: scale(1.05); box-shadow: 0 0 8px rgba(247,215,148,0.2); }

.lock-badge {
  position: absolute; bottom: -2px; right: -4px;
  font-size: 0.55rem; background: #1a1a2e; border-radius: 4px; padding: 1px 3px;
  border: 1px solid #4a4a6a;
}
.restrict-badge {
  position: absolute; top: -6px; left: -6px;
  font-size: 0.5rem; background: rgba(231,76,60,0.3); border-radius: 50%;
  width: 14px; height: 14px; display: flex; align-items: center; justify-content: center;
}
.tower-label {
  position: absolute; bottom: -17px; font-size: 0.55rem; color: #7a7a9a;
  white-space: nowrap; text-align: center; width: 70px; left: 50%; transform: translateX(-50%);
}

.coverage-circle {
  position: absolute; border-radius: 50%;
  border: 1px dashed rgba(100,100,140,0.2);
  background: rgba(100,100,140,0.01);
  pointer-events: none; transition: all 0.3s;
}
.coverage-circle.freq-a { background: rgba(231,76,60,0.04); border-color: rgba(231,76,60,0.15); }
.coverage-circle.freq-b { background: rgba(52,152,219,0.04); border-color: rgba(52,152,219,0.15); }
.coverage-circle.freq-c { background: rgba(46,204,113,0.04); border-color: rgba(46,204,113,0.15); }

.overlap-zone {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 5;
}
.overlap-zone.conflict {
  background: rgba(231,76,60,0.12); border: 2px solid rgba(231,76,60,0.45);
  animation: pulse 1s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

.person { position: absolute; font-size: 0.85rem; z-index: 8; transition: all 0.3s; pointer-events: none; }
.person.interfered { animation: shake 0.3s ease infinite; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }

.signal-line {
  position: absolute; height: 2px; transform-origin: left center;
  z-index: 6; opacity: 0; transition: opacity 0.3s;
}
.signal-line.active { opacity: 1; }
.signal-line.success { background: #2ecc71; box-shadow: 0 0 4px #2ecc71; }
.signal-line.fail { background: #e74c3c; box-shadow: 0 0 4px #e74c3c; }
.signal-dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; top: -1.5px; }
.signal-line.success .signal-dot { background: #2ecc71; animation: sigMove 1s linear infinite; }
.signal-line.fail .signal-dot { background: #e74c3c; animation: sigMove .5s linear infinite; }
@keyframes sigMove { 0%{left:0%} 100%{left:100%} }

.side-panel { width: 210px; display: flex; flex-direction: column; gap: 10px; }
.panel-card {
  background: #1a2a4a; border-radius: 10px; padding: 14px;
  border: 1px solid #2a3a5a;
}
.panel-card h3 {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
  color: #7a7a9a; margin-bottom: 8px;

.freq-legend { display: flex; flex-direction: column; gap: 6px; }
.freq-item { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; }
.freq-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.freq-dot.fa { background: #e74c3c; }
.freq-dot.fb { background: #3498db; }
.freq-dot.fc { background: #2ecc71; }

.stats-row {
  display: flex; justify-content: space-between; align-items: center;

.stats-row:last-child { border-bottom: none; }
.stats-value { font-weight: 700; color: #f7d794; }
.stats-value.good { color: #2ecc71; }
.stats-value.bad { color: #e74c3c; }

.btn-golive {
  width: 100%; padding: 12px; border-radius: 8px; border: none;
  font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
  background: #4a69bd; color: white; text-transform: uppercase; letter-spacing: 1px;

.btn-golive:hover { background: #3a59ad; transform: translateY(-2px); }
.btn-golive.live { background: #e74c3c; }
.btn-golive.success { background: #2ecc71; }

.btn-hints {
  width: 100%; padding: 8px; border-radius: 6px;
  border: 1px solid #f39c12; background: rgba(243,156,18,0.1);
  color: #f39c12; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
  display: none;
}
.btn-hints:hover { background: rgba(243,156,18,0.2); }
.btn-hints.active { background: rgba(243,156,18,0.25); border-style: solid; }

.btn-reset {
  width: 100%; padding: 8px; border-radius: 6px;
  border: 1px solid #4a4a6a; background: transparent;
  color: #8a8aaa; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
}
.btn-reset:hover { border-color: #f7d794; color: #f7d794; }

.message-bar {
  background: #1a2a4a; border-radius: 8px; padding: 10px 14px;
  margin-top: 14px; border: 1px solid #2a3a5a; text-align: center;
  font-size: 0.8rem; min-height: 40px; display: flex;
  align-items: center; justify-content: center; transition: all 0.3s;
}
.message-bar.success { border-color: #2ecc71; color: #2ecc71; background: rgba(46,204,113,0.08); }
.message-bar.warning { border-color: #f39c12; color: #f39c12; background: rgba(243,156,18,0.08); }
.message-bar.error { border-color: #e74c3c; color: #e74c3c; background: rgba(231,76,60,0.08); }

@media (max-width: 750px) {
  .game-layout { flex-direction: column; }
  .map-area { min-width: unset; }
  .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
  .panel-card { flex: 1; min-width: 140px; }
  .level-cards { flex-direction: column; }
}
</style>
</head>

      var tagsHtml = "";
      for (var t = 0; t < lv.tags.length; t++) {
        tagsHtml += '<span class="lc-tag">' + lv.tags[t] + "</span>";
      }
      html += '<div class="level-card" data-level="' + i + '">' +
        '<div class="lc-difficulty">' + lv.difficulty + "</div>" +
        "<h3>" + lv.name + "</h3>" +
        '<div class="lc-sub">' + lv.subtitle + "</div>" +
        "<p>" + lv.brief + "</p>" +
        '<div class="lc-tags">' + tagsHtml + "</div></div>";
    }
    els.levelCards.innerHTML = html;
    var cards = els.levelCards.querySelectorAll(".level-card");
    for (var c = 0; c < cards.length; c++) {
      (function(idx) {
        cards[idx].addEventListener("click", function() { loadLevel(idx); });
      })(c);
    }
  }

  function showLevelSelect() {
    if (isLive) stopLive();
    els.levelSelect.style.display = "";
    els.gameScreen.style.display = "none";
  }

  function loadLevel(idx) {
    currentLevel = idx;
    var lv = LEVELS[idx];
    els.levelSelect.style.display = "none";
    els.gameScreen.style.display = "block";
    els.barTitle.textContent = lv.name;
    els.barDiff.textContent = lv.difficulty;
    els.instructions.innerHTML = lv.instructions;

    towerFreqs = [];
    for (var i = 0; i < lv.towers.length; i++) {
      towerFreqs.push(lv.locked[i] !== undefined ? lv.locked[i] : null);
    }
    isLive = false;
    hintsUnlocked = false;
    hintsShowing = false;
    els.btnHints.style.display = "none";
    els.btnHints.classList.remove("active");
    els.btnHints.textContent = "👁 Show Conflict Hints";

    buildMap();
    updateAllVisuals();
    updateStats();
    setMessage("Click each tower to assign a frequency color. Then hit Go Live!", "");
    els.btnGoLive.textContent = "🚀 Go Live";
    els.btnGoLive.className = "btn-golive";
  }

  function buildMap() {
    var lv = LEVELS[currentLevel];
    var map = els.mapArea;
    map.innerHTML = "";

    // Island
    var island = document.createElement("div");
    island.className = "island";
    island.style.background = lv.islandColor;
    island.style.clipPath = lv.islandClip;
    island.style.webkitClipPath = lv.islandClip;
    map.appendChild(island);

    // Ocean label
    var oc = document.createElement("div");
    oc.className = "ocean-label";
    oc.style.cssText = "top:2%;right:4%;";
    oc.textContent = "🌊 Ocean";
    map.appendChild(oc);

    // Restricted zones
    for (var r = 0; r < lv.rZones.length; r++) {
      var rz = lv.rZones[r];
      var rzEl = document.createElement("div");
      rzEl.className = "restricted-zone";
      rzEl.style.cssText = "left:" + rz.x + "%;top:" + rz.y + "%;width:" + rz.w + "%;height:" + rz.h + "%;";
      var rzLbl = document.createElement("span");
      rzLbl.className = "rz-label";
      rzLbl.textContent = "✈️ " + rz.label;
      rzEl.appendChild(rzLbl);
      map.appendChild(rzEl);
    }

    // Mountains
    for (var m = 0; m < lv.mountains.length; m++) {
      var mt = lv.mountains[m];
      var shape = document.createElement("div");
      shape.className = "mountain-shape";
      shape.style.cssText = "left:" + mt.x + "%;top:" + mt.y + "%;width:" + mt.w + "%;height:" + mt.h + "%;transform:rotate(" + mt.rot + "deg);";
      map.appendChild(shape);
      var mlbl = document.createElement("div");
      mlbl.className = "mountain-label";
      mlbl.style.cssText = "left:" + (mt.x + mt.w / 2 - 4) + "%;top:" + (mt.y + mt.h / 2 - 3) + "%;transform:rotate(" + mt.rot + "deg);";
      mlbl.textContent = "⛰️ " + mt.label;
      map.appendChild(mlbl);
    }

    // Coverage circles
    var R = lv.coverageR;
    for (var ci = 0; ci < lv.towers.length; ci++) {
      var tw = lv.towers[ci];
      var cov = document.createElement("div");
      cov.className = "coverage-circle";
      cov.id = "cov-" + ci;
      cov.style.cssText = "left:" + (tw.x - R) + "%;top:" + (tw.y - R * 1.33) + "%;width:" + (R * 2) + "%;height:" + (R * 2 * 1.33) + "%;";
      map.appendChild(cov);
    }

    // People
    for (var pi = 0; pi < lv.people.length; pi++) {
      var pp = lv.people[pi];
      var per = document.createElement("div");
      per.className = "person";
      per.id = "pers-" + pi;
      per.textContent = "👤";
      per.style.cssText = "left:" + pp.x + "%;top:" + pp.y + "%;";
      map.appendChild(per);
    }

    // Towers
    for (var ti = 0; ti < lv.towers.length; ti++) {
      (function(i) {
        var t = lv.towers[i];
        var tEl = document.createElement("div");
        tEl.className = "tower";
        tEl.id = "tow-" + i;
        tEl.style.cssText = "left:calc(" + t.x + "% - 21px);top:calc(" + t.y + "% - 21px);";
        tEl.textContent = "📡";

        var isLk = lv.locked[i] !== undefined;
        var isRs = lv.restricted[i] && lv.restricted[i].length > 0;

        if (isLk) {
          tEl.classList.add("locked");
          var badge = document.createElement("span");
          badge.className = "lock-badge";
          badge.textContent = "🔒";
          tEl.appendChild(badge);
        }
        if (isRs) {
          var rb = document.createElement("span");
          rb.className = "restrict-badge";
          rb.textContent = "✈";
          tEl.appendChild(rb);
        }
        if (!isLk) {
          tEl.addEventListener("click", function() { cycleTower(i); });
        }
        var lbl = document.createElement("div");
        lbl.className = "tower-label";
        lbl.textContent = t.name;
        tEl.appendChild(lbl);
        map.appendChild(tEl);
      })(ti);
    }
  }

  function cycleTower(i) {
    if (isLive) return;
    var lv = LEVELS[currentLevel];
    if (lv.locked[i] !== undefined) return;
    var banned = lv.restricted[i] || [];
    var avail = [1, 2, 3].filter(function(f) { return banned.indexOf(f) === -1; });
    var cur = towerFreqs[i];
    if (cur === null) {
      towerFreqs[i] = avail[0];
    } else {
      var idx = avail.indexOf(cur);
      towerFreqs[i] = (idx >= avail.length - 1) ? null : avail[idx + 1];
    }
    updateAllVisuals();
    updateStats();
  }

  function updateAllVisuals() {
    var lv = LEVELS[currentLevel];
    for (var i = 0; i < lv.towers.length; i++) {
      var tEl = document.getElementById("tow-" + i);
      tEl.classList.remove("freq-a", "freq-b", "freq-c");
      if (towerFreqs[i]) tEl.classList.add(FC[towerFreqs[i]]);
      var cEl = document.getElementById("cov-" + i);
      cEl.classList.remove("freq-a", "freq-b", "freq-c");
      if (towerFreqs[i]) cEl.classList.add(FC[towerFreqs[i]]);
    }

    // Clear old conflict markers
    var old = document.querySelectorAll(".overlap-zone");
    for (var o = 0; o < old.length; o++) old[o].remove();

    // Only show conflict circles if hints are on
    if (hintsShowing) {
      var conflicts = getConflicts();
      var map = els.mapArea;
      for (var c = 0; c < conflicts.length; c++) {
        var a = conflicts[c][0], b = conflicts[c][1];
        var mx = (lv.towers[a].x + lv.towers[b].x) / 2;
        var my = (lv.towers[a].y + lv.towers[b].y) / 2;
        var zone = document.createElement("div");
        zone.className = "overlap-zone conflict";
        zone.style.cssText = "left:" + (mx - 7) + "%;top:" + (my - 7) + "%;width:14%;height:14%;";
        map.appendChild(zone);
      }
    }
  }

  function getConflicts() {
    var lv = LEVELS[currentLevel];
    var result = [];
    for (var i = 0; i < lv.adj.length; i++) {
      var a = lv.adj[i][0], b = lv.adj[i][1];
      if (towerFreqs[a] && towerFreqs[b] && towerFreqs[a] === towerFreqs[b]) {
        result.push([a, b]);
      }
    }
    return result;
  }

  function updateStats() {
    var lv = LEVELS[currentLevel];
    var assigned = 0;
    for (var i = 0; i < towerFreqs.length; i++) {
      if (towerFreqs[i] !== null) assigned++;
    }
    els.statAssigned.textContent = assigned + " / " + lv.towers.length;
    if (!isLive) {
      els.statConflicts.textContent = "—";
      els.statConflicts.className = "stats-value";
      els.statCalls.textContent = "—";
      els.statCalls.className = "stats-value";
      els.statCoverage.textContent = "—";
      els.statCoverage.className = "stats-value";
    }
  }

  function goLive() {
    var lv = LEVELS[currentLevel];
    var assigned = 0;
    for (var i = 0; i < towerFreqs.length; i++) {
      if (towerFreqs[i] !== null) assigned++;
    }
    if (assigned < lv.towers.length) {
      setMessage("Assign a frequency to ALL towers before going live!", "warning");
      return;
    }
    if (isLive) { stopLive(); return; }

    isLive = true;
    els.btnGoLive.textContent = "⏹ Stop";
    els.btnGoLive.className = "btn-golive live";
    var tw = document.querySelectorAll(".tower:not(.locked)");
    for (var t = 0; t < tw.length; t++) tw[t].style.cursor = "default";

    simulate();
  }

  function stopLive() {
    isLive = false;
    els.btnGoLive.textContent = "🚀 Go Live";
    els.btnGoLive.className = "btn-golive";
    var tw = document.querySelectorAll(".tower:not(.locked)");
    for (var t = 0; t < tw.length; t++) tw[t].style.cursor = "pointer";
    var lines = document.querySelectorAll(".signal-line");
    for (var l = 0; l < lines.length; l++) lines[l].remove();
    var lv = LEVELS[currentLevel];
    for (var p = 0; p < lv.people.length; p++) {
      var el = document.getElementById("pers-" + p);
      el.className = "person";
      el.textContent = "👤";
    }
    updateStats();
    setMessage("Click each tower to assign a frequency color. Then hit Go Live!", "");
  }

  function simulate() {
    var lv = LEVELS[currentLevel];
    var conflicts = getConflicts();
    var conflictSet = {};
    for (var c = 0; c < conflicts.length; c++) {
      conflictSet[conflicts[c][0]] = true;
      conflictSet[conflicts[c][1]] = true;
    }

    var map = els.mapArea;
    var ok = 0, fail = 0;

    for (var i = 0; i < lv.people.length; i++) {
      (function(idx) {
        var p = lv.people[idx];
        var pEl = document.getElementById("pers-" + idx);
        var tw = lv.towers[p.n];
        var bad = conflictSet[p.n] === true;

        var line = document.createElement("div");
        line.className = "signal-line";
        var dx = tw.x - p.x, dy = tw.y - p.y;
        var len = Math.sqrt(dx * dx + dy * dy);
        var ang = Math.atan2(dy, dx) * 180 / Math.PI;
        line.style.cssText = "left:" + p.x + "%;top:" + p.y + "%;width:" + len + "%;transform:rotate(" + ang + "deg);";
        var dot = document.createElement("div");
        dot.className = "signal-dot";
        line.appendChild(dot);

        if (bad) {
          line.classList.add("fail"); pEl.textContent = "😤"; pEl.className = "person interfered"; fail++;
        } else {
          line.classList.add("success"); pEl.textContent = "😊"; pEl.className = "person happy"; ok++;
        }
        map.appendChild(line);
        setTimeout(function() { line.classList.add("active"); }, idx * 60);
      })(i);
    }

    var totalOk = ok, totalFail = fail, totalPeople = lv.people.length;

    setTimeout(function() {
      // Update stats
      els.statConflicts.textContent = conflicts.length;
      els.statConflicts.className = "stats-value" + (conflicts.length > 0 ? " bad" : " good");
      els.statCalls.textContent = totalOk + " / " + (totalOk + totalFail);
      els.statCalls.className = "stats-value" + (totalFail === 0 ? " good" : " bad");
      els.statCoverage.textContent = totalPeople + " / " + totalPeople;
      els.statCoverage.className = "stats-value good";

      if (totalFail === 0) {
        setMessage("🎉 Perfect network! Zero interference — all " + totalOk + " calls connected!", "success");
        els.btnGoLive.className = "btn-golive success";
        els.btnGoLive.textContent = "✓ Network Active!";
      } else {
        setMessage("⚠️ " + totalFail + " call" + (totalFail > 1 ? "s" : "") + " failed due to interference! Try adjusting your frequencies.", "error");
        // Unlock hints after first failure
        if (!hintsUnlocked) {
          hintsUnlocked = true;
          els.btnHints.style.display = "block";
        }
      }
    }, totalPeople * 60 + 300);
  }

  function toggleHints() {
    hintsShowing = !hintsShowing;
    if (hintsShowing) {
      els.btnHints.textContent = "👁 Hide Conflict Hints";
      els.btnHints.classList.add("active");
    } else {
      els.btnHints.textContent = "👁 Show Conflict Hints";
      els.btnHints.classList.remove("active");
    }
    updateAllVisuals();
  }

  function resetNetwork() {
    if (isLive) stopLive();
    var lv = LEVELS[currentLevel];
    towerFreqs = [];
    for (var i = 0; i < lv.towers.length; i++) {
      towerFreqs.push(lv.locked[i] !== undefined ? lv.locked[i] : null);
    }
    hintsShowing = false;
    els.btnHints.textContent = "👁 Show Conflict Hints";
    els.btnHints.classList.remove("active");
    updateAllVisuals();
    updateStats();
    setMessage("Click each tower to assign a frequency color. Then hit Go Live!", "");
  }

  function setMessage(text, type) {
    els.messageBar.textContent = text;
    els.messageBar.className = "message-bar" + (type ? " " + type : "");
  }

  function init() {
    initRefs();
    buildLevelSelect();
    els.btnGoLive.addEventListener("click", goLive);
    els.btnHints.addEventListener("click", toggleHints);
    els.btnReset.addEventListener("click", resetNetwork);
    els.backBtn.addEventListener("click", showLevelSelect);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>


</body></html>
