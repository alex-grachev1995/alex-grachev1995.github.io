":{"pageProps":{"data":{"mainQuery":{"sharedPreview":{"shareUrl":"https://poe.com/preview/yYYY5TCrisN4BoLG1R2N","shareCode":"yYYY5TCrisN4BoLG1R2N","contentObject":{"content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eModern Weather Instruments Explorer\u003c/title\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700\u0026family=Roboto:wght@400;500;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    font-family: 'Merriweather', serif;\n    background: #e8eef5;\n    color: #2c3e50;\n    min-height: 100vh;\n    display: flex;\n    justify-content: center;\n    padding: 20px;\n  }\n\n  #app {\n    max-width: 780px;\n    width: 100%;\n  }\n\n  /* Progress Bar */\n  .progress-bar-container {\n    background: #c8d6e5;\n    border-radius: 12px;\n    height: 10px;\n    margin-bottom: 20px;\n    overflow: hidden;\n  }\n  .progress-bar-fill {\n    height: 100%;\n    background: linear-gradient(90deg, #3498db, #1a5276);\n    border-radius: 12px;\n    transition: width 0.5s ease;\n  }\n  .progress-text {\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.85rem;\n    color: #7f8c8d;\n    text-align: center;\n    margin-bottom: 8px;\n  }\n\n  /* Card */\n  .card {\n    background: #fff;\n    border-radius: 16px;\n    box-shadow: 0 4px 20px rgba(0,0,0,0.08);\n    padding: 36px 32px;\n    animation: fadeIn 0.4s ease;\n  }\n\n  @keyframes fadeIn {\n    from { opacity: 0; transform: translateY(12px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  /* Intro / Section Headers */\n  .section-label {\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.75rem;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    color: #3498db;\n    margin-bottom: 6px;\n  }\n  .card h1 {\n    font-size: 1.8rem;\n    color: #1a5276;\n    margin-bottom: 12px;\n    line-height: 1.3;\n  }\n  .card h2 {\n    font-size: 1.4rem;\n    color: #1a5276;\n    margin-bottom: 10px;\n  }\n\n  .instrument-emoji {\n    font-size: 3.5rem;\n    margin-bottom: 10px;\n    display: block;\n  }\n\n  .instrument-name {\n    font-family: 'Roboto', sans-serif;\n    font-size: 1.5rem;\n    font-weight: 700;\n    color: #1a5276;\n    margin-bottom: 14px;\n  }\n\n  .description {\n    font-size: 1rem;\n    line-height: 1.75;\n    margin-bottom: 18px;\n    color: #34495e;\n  }\n\n  .fun-fact {\n    background: #eaf4fd;\n    border-left: 4px solid #3498db;\n    border-radius: 0 10px 10px 0;\n    padding: 14px 18px;\n    margin-bottom: 24px;\n    font-size: 0.92rem;\n    line-height: 1.6;\n    color: #2c3e50;\n  }\n  .fun-fact strong {\n    color: #1a5276;\n  }\n\n  /* Question Area */\n  .question-divider {\n    border: none;\n    border-top: 2px dashed #c8d6e5;\n    margin: 24px 0;\n  }\n\n  .question-label {\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.8rem;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 1.5px;\n    color: #e67e22;\n    margin-bottom: 8px;\n  }\n\n  .question-text {\n    font-size: 1.05rem;\n    font-weight: 700;\n    margin-bottom: 16px;\n    line-height: 1.5;\n  }\n\n  /* Options */\n  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }\n\n  .option {\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.95rem;\n    padding: 14px 18px;\n    border: 2px solid #dce1e8;\n    border-radius: 10px;\n    cursor: pointer;\n    transition: all 0.2s ease;\n    background: #fafbfd;\n    line-height: 1.4;\n  }\n  .option:hover:not(.disabled) {\n    border-color: #3498db;\n    background: #eaf4fd;\n  }\n  .option.selected {\n    border-color: #3498db;\n    background: #d6eaf8;\n  }\n  .option.correct {\n    border-color: #27ae60;\n    background: #eafaf1;\n    color: #1e8449;\n  }\n  .option.incorrect {\n    border-color: #e74c3c;\n    background: #fdedec;\n    color: #c0392b;\n  }\n  .option.disabled {\n    cursor: default;\n    opacity: 0.7;\n  }\n  .option.show-correct {\n    border-color: #27ae60;\n    background: #eafaf1;\n  }\n\n  /* Explanation */\n  .explanation {\n    padding: 14px 18px;\n    border-radius: 10px;\n    margin-bottom: 16px;\n    font-size: 0.92rem;\n    line-height: 1.5;\n    display: none;\n  }\n  .explanation.correct-exp {\n    background: #eafaf1;\n    border-left: 4px solid #27ae60;\n    color: #1e8449;\n  }\n  .explanation.incorrect-exp {\n    background: #fdedec;\n    border-left: 4px solid #e74c3c;\n    color: #c0392b;\n  }\n\n  /* Buttons */\n  .btn-row {\n    display: flex;\n    gap: 12px;\n    flex-wrap: wrap;\n  }\n  .btn {\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.95rem;\n    font-weight: 600;\n    padding: 12px 28px;\n    border: none;\n    border-radius: 8px;\n    cursor: pointer;\n    transition: all 0.2s ease;\n  }\n  .btn:active { transform: scale(0.97); }\n  .btn-primary {\n    background: #3498db;\n    color: #fff;\n  }\n  .btn-primary:hover { background: #2980b9; }\n  .btn-primary:disabled {\n    background: #bdc3c7;\n    cursor: not-allowed;\n  }\n  .btn-secondary {\n    background: #ecf0f1;\n    color: #2c3e50;\n  }\n  .btn-secondary:hover { background: #d5dbdb; }\n  .btn-start {\n    background: linear-gradient(135deg, #1a5276, #3498db);\n    color: #fff;\n    font-size: 1.1rem;\n    padding: 15px 40px;\n  }\n  .btn-start:hover { opacity: 0.9; }\n\n  /* Shake animation */\n  @keyframes shake {\n    0%, 100% { transform: translateX(0); }\n    20% { transform: translateX(-6px); }\n    40% { transform: translateX(6px); }\n    60% { transform: translateX(-4px); }\n    80% { transform: translateX(4px); }\n  }\n  .shake { animation: shake 0.5s ease; }\n\n  /* Results */\n  .score-display {\n    font-size: 3rem;\n    font-weight: 700;\n    color: #1a5276;\n    text-align: center;\n    margin: 16px 0;\n    font-family: 'Roboto', sans-serif;\n  }\n  .score-subtitle {\n    text-align: center;\n    font-size: 1.1rem;\n    color: #7f8c8d;\n    margin-bottom: 20px;\n  }\n  .score-bar-bg {\n    background: #ecf0f1;\n    border-radius: 10px;\n    height: 16px;\n    margin-bottom: 24px;\n    overflow: hidden;\n  }\n  .score-bar-fill {\n    height: 100%;\n    border-radius: 10px;\n    transition: width 1s ease;\n  }\n  .score-message {\n    text-align: center;\n    font-size: 1.05rem;\n    margin-bottom: 20px;\n    line-height: 1.6;\n  }\n  .results-breakdown {\n    background: #f8f9fa;\n    border-radius: 10px;\n    padding: 16px 20px;\n    margin-bottom: 20px;\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.9rem;\n  }\n  .results-breakdown div {\n    display: flex;\n    justify-content: space-between;\n    padding: 6px 0;\n    border-bottom: 1px solid #ecf0f1;\n  }\n  .results-breakdown div:last-child { border: none; }\n\n  /* Confetti */\n  .confetti-piece {\n    position: fixed;\n    width: 10px;\n    height: 10px;\n    pointer-events: none;\n    z-index: 9999;\n    opacity: 1;\n  }\n\n  /* Intro list */\n  .intro-list {\n    list-style: none;\n    padding: 0;\n    margin: 16px 0;\n  }\n  .intro-list li {\n    font-family: 'Roboto', sans-serif;\n    font-size: 0.95rem;\n    padding: 8px 0;\n    border-bottom: 1px solid #ecf0f1;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n  }\n  .intro-list li:last-child { border: none; }\n  .intro-list .li-emoji { font-size: 1.3rem; }\n\n  .quiz-intro-icon {\n    font-size: 4rem;\n    text-align: center;\n    display: block;\n    margin-bottom: 10px;\n  }\n\n  .text-center { text-align: center; }\n\n  @media (max-width: 600px) {\n    .card { padding: 24px 18px; }\n    .card h1 { font-size: 1.4rem; }\n    .instrument-emoji { font-size: 2.8rem; }\n    .btn { padding: 11px 20px; font-size: 0.9rem; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv id=\"app\"\u003e\u003c/div\u003e\n\n\u003cscript\u003e\nconst instruments = [\n  {\n    emoji: \"🛰️\",\n    name: \"Weather Satellites\",\n    description: `Two main types orbit Earth watching our weather from space. \u003cstrong\u003eGeostationary satellites\u003c/strong\u003e (like GOES) hover about 36,000 km above the equator, always watching the same region — perfect for tracking storms in real time. \u003cstrong\u003ePolar-orbiting satellites\u003c/strong\u003e (like JPSS) circle from pole to pole at about 800 km altitude, scanning the entire planet twice a day and building a detailed global picture. Together, they monitor cloud patterns, sea surface temperatures, humidity, wildfires, and even volcanic ash clouds.`,\n    funFact: `The first weather satellite, TIROS-1, launched in 1960 and could only take blurry black-and-white photos. Today's satellites can detect temperature differences of less than 0.1°C from space!`,\n    question: \"A geostationary satellite stays above the same spot on Earth. At what approximate altitude does it orbit?\",\n    options: [\n      \"400 km (International Space Station altitude)\",\n      \"2,000 km\",\n      \"36,000 km\",\n      \"384,000 km (the Moon's distance)\"\n    ],\n    correct: 2,\n    explanation: \"Geostationary satellites orbit at about 36,000 km. At this precise altitude, their orbital period matches Earth's rotation, so they hover over the same spot.\"\n  },\n  {\n    emoji: \"📡\",\n    name: \"Doppler Radar\",\n    description: `Radar stations send out pulses of microwave energy and measure what bounces back from rain, snow, or hail. This tells meteorologists where precipitation is and how heavy it is. But \u003cstrong\u003eDoppler\u003c/strong\u003e radar goes further: by measuring tiny shifts in the frequency of returning signals — the \u003cem\u003eDoppler effect\u003c/em\u003e, like how an ambulance siren changes pitch as it passes you — it detects whether precipitation is moving \u003cstrong\u003etoward\u003c/strong\u003e or \u003cstrong\u003eaway from\u003c/strong\u003e the radar station. This is crucial for spotting the rotating winds inside tornadoes.`,\n    funFact: `The US alone has a network of 159 Doppler radar stations (called NEXRAD) that together cover nearly the entire country. Their data updates every 4–5 minutes.`,\n    question: \"What specific information does the Doppler effect allow this radar to detect that regular radar cannot?\",\n    options: [\n      \"The size of individual raindrops\",\n      \"The motion of precipitation toward or away from the radar\",\n      \"The temperature inside a cloud\",\n      \"The altitude of the cloud tops\"\n    ],\n    correct: 1,\n    explanation: \"The Doppler effect detects motion — specifically whether precipitation particles are moving toward or away from the radar. This reveals wind patterns, including the dangerous rotation inside tornadic storms.\"\n  },\n  {\n    emoji: \"🎈\",\n    name: \"Radiosondes (Weather Balloons)\",\n    description: `A radiosonde is a small instrument package — about the size of a milk carton — carried into the atmosphere by a helium-filled balloon. As it rises to about 30 km altitude (the stratosphere!), it measures \u003cstrong\u003etemperature, humidity, pressure, and wind\u003c/strong\u003e at every level, transmitting data back by radio. These vertical profiles are critical for weather models. Over \u003cstrong\u003e900 stations\u003c/strong\u003e worldwide launch radiosondes \u003cstrong\u003etwice daily\u003c/strong\u003e — at exactly 00:00 and 12:00 UTC — creating a synchronized global snapshot of the atmosphere.`,\n    funFact: `The balloon expands as it rises (because air pressure drops) until it pops at about 30 km. The radiosonde parachutes back to Earth — and some actually have \"PLEASE RETURN\" labels on them!`,\n    question: \"How often are radiosondes launched from weather stations around the world?\",\n    options: [\n      \"Every hour\",\n      \"Once a day\",\n      \"Twice a day (00:00 and 12:00 UTC)\",\n      \"Once a week\"\n    ],\n    correct: 2,\n    explanation: \"Over 900 stations worldwide launch radiosondes twice daily, synchronized to 00:00 and 12:00 UTC, creating a coordinated snapshot of the atmosphere's vertical structure.\"\n  },\n  {\n    emoji: \"🏗️\",\n    name: \"Automated Weather Stations (AWS)\",\n    description: `These ground-based stations have replaced the old staffed weather stations with digital sensors that measure \u003cstrong\u003etemperature, humidity, pressure, wind speed and direction, rainfall, and solar radiation\u003c/strong\u003e — continuously, every few minutes, with no human operator needed. Data is transmitted automatically via satellite or internet. Thousands are deployed worldwide, including in remote mountaintops, deserts, and polar regions where no human could be stationed permanently.`,\n    funFact: `The old analog mercury instruments from the text have been largely replaced in professional stations — partly because mercury is toxic! Modern digital sensors are safer, more accurate, and report automatically.`,\n    question: \"What is a key advantage of AWS over traditional staffed weather stations?\",\n    options: [\n      \"They are always more accurate than any human reading\",\n      \"They can operate in remote locations and report continuously without human operators\",\n      \"They are cheaper to build than traditional stations\",\n      \"They can predict the weather by themselves\"\n    ],\n    correct: 1,\n    explanation: \"The biggest advantage is continuous, automated operation in any location — including remote places where staffing a station would be impractical or impossible.\"\n  },\n  {\n    emoji: \"🌊\",\n    name: \"Ocean Buoys \u0026 Argo Floats\",\n    description: `The ocean covers \u003cstrong\u003e70%\u003c/strong\u003e of Earth's surface, so we can't forecast weather without ocean data. \u003cstrong\u003eMoored buoys\u003c/strong\u003e are anchored at fixed locations and measure surface conditions — waves, wind, temperature, pressure. But the real revolution is \u003cstrong\u003eArgo floats\u003c/strong\u003e: about \u003cstrong\u003e4,000 autonomous robots\u003c/strong\u003e drifting in the world's oceans. Every 10 days, each float dives to 2,000 meters depth, measuring ocean temperature and salinity as it descends and ascends, then surfaces to transmit its data via satellite.`,\n    funFact: `Before Argo floats (deployed starting in 2000), scientists had almost no data about what was happening below the ocean surface between shipping routes. The Argo network was one of the biggest leaps in Earth observation history.`,\n    question: \"Approximately how many Argo floats are currently operating in the world's oceans?\",\n    options: [\n      \"400\",\n      \"1,000\",\n      \"4,000\",\n      \"40,000\"\n    ],\n    correct: 2,\n    explanation: \"About 4,000 Argo floats are distributed across the world's oceans, creating a continuous 3D map of ocean temperature and salinity — data that was almost entirely missing before 2000.\"\n  },\n  {\n    emoji: \"💻\",\n    name: \"Supercomputers \u0026 Weather Models\",\n    description: `All the data from satellites, radar, radiosondes, weather stations, and ocean buoys flows into some of the most powerful \u003cstrong\u003esupercomputers\u003c/strong\u003e on the planet. There, \u003cstrong\u003eNumerical Weather Prediction (NWP)\u003c/strong\u003e models divide the atmosphere into millions of 3D grid cells and solve physics equations — fluid dynamics, thermodynamics, radiation — for each one, stepping forward in time. The two most famous global models are the European \u003cstrong\u003eECMWF\u003c/strong\u003e and the American \u003cstrong\u003eGFS\u003c/strong\u003e. Modern forecasts are reliably accurate up to about \u003cstrong\u003e7 days\u003c/strong\u003e.`,\n    funFact: `A single forecast run at ECMWF processes about 800 billion calculations per second. Here's a stunning comparison: the 5-day forecast today is as accurate as the 1-day forecast was in 1980!`,\n    question: \"What is the approximate limit of reliable weather forecasting with current technology?\",\n    options: [\n      \"24 hours\",\n      \"3 days\",\n      \"7 days\",\n      \"30 days\"\n    ],\n    correct: 2,\n    explanation: \"Modern numerical weather prediction is reliably accurate up to about 7 days. Beyond that, the chaotic nature of the atmosphere makes detailed prediction increasingly uncertain.\"\n  }\n];\n\nconst quizQuestions = [\n  {\n    question: \"Which instrument would be most useful for detecting dangerous rotation inside a thunderstorm?\",\n    options: [\n      \"Weather satellite\",\n      \"Radiosonde (weather balloon)\",\n      \"Doppler radar\",\n      \"Automated weather station\"\n    ],\n    correct: 2,\n    explanation: \"Doppler radar detects the motion of precipitation, which reveals the rotating winds inside thunderstorms that can spawn tornadoes.\"\n  },\n  {\n    question: \"A scientist needs to measure temperature and humidity at 25 km altitude. Which instrument should they use?\",\n    options: [\n      \"Ocean buoy\",\n      \"Doppler radar\",\n      \"Automated weather station\",\n      \"Radiosonde (weather balloon)\"\n    ],\n    correct: 3,\n    explanation: \"Radiosondes are carried by balloon up to ~30 km altitude, measuring temperature, humidity, pressure, and wind throughout the atmosphere's vertical profile.\"\n  },\n  {\n    question: \"Which of these is NOT something weather satellites can monitor?\",\n    options: [\n      \"Cloud patterns and storm movement\",\n      \"Sea surface temperature\",\n      \"Underground water tables\",\n      \"Wildfire locations\"\n    ],\n    correct: 2,\n    explanation: \"Satellites observe the surface and atmosphere from above. They cannot see underground. Monitoring underground water requires ground-based instruments.\"\n  },\n  {\n    question: \"What percentage of Earth's surface is covered by ocean, making instruments like buoys and Argo floats essential?\",\n    options: [\"50%\", \"60%\", \"70%\", \"80%\"],\n    correct: 2,\n    explanation: \"About 70% of Earth's surface is ocean. Without ocean-based instruments, weather and climate models would be missing data from most of the planet.\"\n  },\n  {\n    question: \"A modern 5-day weather forecast is as accurate as a _____ forecast was in 1980.\",\n    options: [\"1-day\", \"2-day\", \"3-day\", \"4-day\"],\n    correct: 0,\n    explanation: \"Thanks to vastly better data, models, and computing power, today's 5-day forecast matches the accuracy of a mere 1-day forecast from 1980. That's a remarkable improvement.\"\n  }\n];\n\n// ─── State ──────────────────────────────────\nlet phase = 'intro'; // intro, instrument, quiz-intro, quiz, results\nlet instrumentIdx = 0;\nlet quizIdx = 0;\nlet instrumentScore = 0;\nlet quizScore = 0;\nlet selectedOption = null;\nlet answered = false;\nlet attempts = 0;\nconst totalScreens = 1 + instruments.length + 1 + quizQuestions.length + 1;\n\nfunction currentScreenNum() {\n  if (phase === 'intro') return 0;\n  if (phase === 'instrument') return 1 + instrumentIdx;\n  if (phase === 'quiz-intro') return 1 + instruments.length;\n  if (phase === 'quiz') return 2 + instruments.length + quizIdx;\n  return totalScreens - 1;\n}\n\n// ─── Render ─────────────────────────────────\nfunction render() {\n  selectedOption = null;\n  answered = false;\n  attempts = 0;\n  const app = document.getElementById('app');\n\n  let progressHTML = '';\n  if (phase !== 'intro' \u0026\u0026 phase !== 'results') {\n    const pct = Math.round((currentScreenNum() / (totalScreens - 1)) * 100);\n    const screenLabel = phase === 'instrument'\n      ? `Instrument ${instrumentIdx + 1} of ${instruments.length}`\n      : phase === 'quiz-intro'\n        ? 'Final Challenge'\n        : phase === 'quiz'\n          ? `Quiz Question ${quizIdx + 1} of ${quizQuestions.length}`\n          : '';\n    progressHTML = `\n      \u003cdiv class=\"progress-text\"\u003e${screenLabel}\u003c/div\u003e\n      \u003cdiv class=\"progress-bar-container\"\u003e\n        \u003cdiv class=\"progress-bar-fill\" style=\"width:${pct}%\"\u003e\u003c/div\u003e\n      \u003c/div\u003e`;\n  }\n\n  if (phase === 'intro') {\n    app.innerHTML = `\n      ${progressHTML}\n      \u003cdiv class=\"card text-center\"\u003e\n        \u003cspan class=\"instrument-emoji\"\u003e🌐\u003c/span\u003e\n        \u003cdiv class=\"section-label\"\u003eActivity 5\u003c/div\u003e\n        \u003ch1\u003eModern Weather Instruments Explorer\u003c/h1\u003e\n        \u003cp class=\"description\" style=\"text-align:left;\"\u003eYou've learned about classic instruments — thermometers, barometers, hygrometers. Now discover the modern tools that let scientists track weather across the \u003cstrong\u003eentire planet\u003c/strong\u003e:\u003c/p\u003e\n        \u003cul class=\"intro-list\"\u003e\n          \u003cli\u003e\u003cspan class=\"li-emoji\"\u003e🛰️\u003c/span\u003e Weather Satellites\u003c/li\u003e\n          \u003cli\u003e\u003cspan class=\"li-emoji\"\u003e📡\u003c/span\u003e Doppler Radar\u003c/li\u003e\n          \u003cli\u003e\u003cspan class=\"li-emoji\"\u003e🎈\u003c/span\u003e Radiosondes \u0026 Weather Balloons\u003c/li\u003e\n          \u003cli\u003e\u003cspan class=\"li-emoji\"\u003e🏗️\u003c/span\u003e Automated Weather Stations\u003c/li\u003e\n          \u003cli\u003e\u003cspan class=\"li-emoji\"\u003e🌊\u003c/span\u003e Ocean Buoys \u0026 Argo Floats\u003c/li\u003e\n          \u003cli\u003e\u003cspan class=\"li-emoji\"\u003e💻\u003c/span\u003e Supercomputers \u0026 Weather Models\u003c/li\u003e\n        \u003c/ul\u003e\n        \u003cp class=\"description\"\u003eEach instrument has a short reading and one question. Then there's a \u003cstrong\u003eFinal Challenge\u003c/strong\u003e quiz at the end.\u003c/p\u003e\n        \u003cdiv class=\"btn-row\" style=\"justify-content:center; margin-top:20px;\"\u003e\n          \u003cbutton class=\"btn btn-start\" onclick=\"startInstruments()\"\u003eLet's Explore →\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e`;\n  } else if (phase === 'instrument') {\n    const inst = instruments[instrumentIdx];\n    app.innerHTML = `\n      ${progressHTML}\n      \u003cdiv class=\"card\"\u003e\n        \u003cspan class=\"instrument-emoji\"\u003e${inst.emoji}\u003c/span\u003e\n        \u003cdiv class=\"instrument-name\"\u003e${inst.name}\u003c/div\u003e\n        \u003cp class=\"description\"\u003e${inst.description}\u003c/p\u003e\n        \u003cdiv class=\"fun-fact\"\u003e\u003cstrong\u003e💡 Fun Fact:\u003c/strong\u003e ${inst.funFact}\u003c/div\u003e\n        \u003chr class=\"question-divider\"\u003e\n        \u003cdiv class=\"question-label\"\u003e📝 Knowledge Check\u003c/div\u003e\n        \u003cp class=\"question-text\"\u003e${inst.question}\u003c/p\u003e\n        \u003cdiv class=\"options\" id=\"options\"\u003e\n          ${inst.options.map((o, i) =\u003e `\u003cdiv class=\"option\" data-idx=\"${i}\" onclick=\"selectOption(${i})\"\u003e${o}\u003c/div\u003e`).join('')}\n        \u003c/div\u003e\n        \u003cdiv class=\"explanation\" id=\"explanation\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"btn-row\"\u003e\n          \u003cbutton class=\"btn btn-primary\" id=\"checkBtn\" onclick=\"checkAnswer()\" disabled\u003eCheck Answer\u003c/button\u003e\n          \u003cbutton class=\"btn btn-primary\" id=\"nextBtn\" onclick=\"nextScreen()\" style=\"display:none\"\u003eNext →\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e`;\n  } else if (phase === 'quiz-intro') {\n    app.innerHTML = `\n      ${progressHTML}\n      \u003cdiv class=\"card text-center\"\u003e\n        \u003cspan class=\"quiz-intro-icon\"\u003e🏆\u003c/span\u003e\n        \u003ch1\u003eFinal Challenge\u003c/h1\u003e\n        \u003cp class=\"description\"\u003eGreat work exploring all six modern instruments! Now let's see how well you can apply what you've learned. \u003cstrong\u003e5 questions\u003c/strong\u003e mixing all the instruments together.\u003c/p\u003e\n        \u003cp class=\"description\"\u003eYour current score from the instrument pages: \u003cstrong\u003e${instrumentScore} / ${instruments.length}\u003c/strong\u003e\u003c/p\u003e\n        \u003cdiv class=\"btn-row\" style=\"justify-content:center; margin-top:20px;\"\u003e\n          \u003cbutton class=\"btn btn-start\" onclick=\"startQuiz()\"\u003eStart the Challenge →\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e`;\n  } else if (phase === 'quiz') {\n    const q = quizQuestions[quizIdx];\n    app.innerHTML = `\n      ${progressHTML}\n      \u003cdiv class=\"card\"\u003e\n        \u003cdiv class=\"section-label\"\u003eFinal Challenge\u003c/div\u003e\n        \u003cp class=\"question-text\"\u003e${q.question}\u003c/p\u003e\n        \u003cdiv class=\"options\" id=\"options\"\u003e\n          ${q.options.map((o, i) =\u003e `\u003cdiv class=\"option\" data-idx=\"${i}\" onclick=\"selectOption(${i})\"\u003e${o}\u003c/div\u003e`).join('')}\n        \u003c/div\u003e\n        \u003cdiv class=\"explanation\" id=\"explanation\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"btn-row\"\u003e\n          \u003cbutton class=\"btn btn-primary\" id=\"checkBtn\" onclick=\"checkAnswer()\" disabled\u003eCheck Answer\u003c/button\u003e\n          \u003cbutton class=\"btn btn-primary\" id=\"nextBtn\" onclick=\"nextScreen()\" style=\"display:none\"\u003e${quizIdx \u003c quizQuestions.length - 1 ? 'Next →' : 'See Results →'}\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e`;\n  } else if (phase === 'results') {\n    const total = instrumentScore + quizScore;\n    const max = instruments.length + quizQuestions.length;\n    const pct = Math.round((total / max) * 100);\n    const color = pct \u003e= 80 ? '#27ae60' : pct \u003e= 50 ? '#e67e22' : '#e74c3c';\n    const msg = pct \u003e= 90 ? \"Outstanding! You've mastered modern weather instruments! 🌟\"\n      : pct \u003e= 70 ? \"Great job! You've got a solid understanding of modern weather technology. 👍\"\n      : pct \u003e= 50 ? \"Good effort! Review the instruments you missed and try again. 📖\"\n      : \"Keep learning! Try re-reading the instrument pages and give it another shot. 💪\";\n    app.innerHTML = `\n      \u003cdiv class=\"card text-center\"\u003e\n        \u003cspan class=\"quiz-intro-icon\"\u003e📊\u003c/span\u003e\n        \u003ch1\u003eYour Results\u003c/h1\u003e\n        \u003cdiv class=\"score-display\" style=\"color:${color}\"\u003e${total} / ${max}\u003c/div\u003e\n        \u003cdiv class=\"score-subtitle\"\u003e${pct}% correct\u003c/div\u003e\n        \u003cdiv class=\"score-bar-bg\"\u003e\n          \u003cdiv class=\"score-bar-fill\" id=\"scoreBar\" style=\"width:0%; background:${color}\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"results-breakdown\"\u003e\n          \u003cdiv\u003e\u003cspan\u003eInstrument Pages\u003c/span\u003e\u003cspan\u003e${instrumentScore} / ${instruments.length}\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cspan\u003eFinal Challenge\u003c/span\u003e\u003cspan\u003e${quizScore} / ${quizQuestions.length}\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"score-message\"\u003e${msg}\u003c/p\u003e\n        \u003cdiv class=\"btn-row\" style=\"justify-content:center;\"\u003e\n          \u003cbutton class=\"btn btn-start\" onclick=\"location.reload()\"\u003eRestart Explorer 🔄\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e`;\n    setTimeout(() =\u003e {\n      const bar = document.getElementById('scoreBar');\n      if (bar) bar.style.width = pct + '%';\n    }, 100);\n    if (pct \u003e= 70) launchConfetti();\n  }\n}\n\n// ─── Interaction ────────────────────────────\nfunction selectOption(idx) {\n  if (answered) return;\n  selectedOption = idx;\n  document.querySelectorAll('.option').forEach((el, i) =\u003e {\n    el.classList.toggle('selected', i === idx);\n  });\n  document.getElementById('checkBtn').disabled = false;\n}\n\nfunction checkAnswer() {\n  if (selectedOption === null || answered) return;\n  attempts++;\n  const isInstrument = phase === 'instrument';\n  const data = isInstrument ? instruments[instrumentIdx] : quizQuestions[quizIdx];\n  const correct = data.correct;\n  const isCorrect = selectedOption === correct;\n\n  const options = document.querySelectorAll('.option');\n  const expEl = document.getElementById('explanation');\n\n  if (isCorrect) {\n    options[selectedOption].classList.add('correct');\n    options.forEach(o =\u003e o.classList.add('disabled'));\n    expEl.className = 'explanation correct-exp';\n    expEl.innerHTML = `\u003cstrong\u003e✅ Correct!\u003c/strong\u003e ${data.explanation}`;\n    expEl.style.display = 'block';\n    if (attempts \u003c= 2) {\n      if (isInstrument) instrumentScore++; else quizScore++;\n    }\n    answered = true;\n    document.getElementById('checkBtn').style.display = 'none';\n    document.getElementById('nextBtn').style.display = 'inline-block';\n    launchMiniConfetti();\n  } else {\n    options[selectedOption].classList.add('incorrect');\n    const card = document.querySelector('.card');\n    card.classList.add('shake');\n    setTimeout(() =\u003e card.classList.remove('shake'), 500);\n    if (attempts \u003e= 2) {\n      options.forEach((o, i) =\u003e {\n        o.classList.add('disabled');\n        if (i === correct) o.classList.add('show-correct');\n      });\n      expEl.className = 'explanation incorrect-exp';\n      expEl.innerHTML = `\u003cstrong\u003e✗ Not quite.\u003c/strong\u003e ${data.explanation}`;\n      expEl.style.display = 'block';\n      answered = true;\n      document.getElementById('checkBtn').style.display = 'none';\n      document.getElementById('nextBtn').style.display = 'inline-block';\n    } else {\n      options[selectedOption].classList.remove('selected');\n      selectedOption = null;\n      setTimeout(() =\u003e {\n        options.forEach(o =\u003e {\n          if (o.classList.contains('incorrect')) {\n            o.classList.add('disabled');\n          }\n        });\n      }, 300);\n    }\n  }\n}\n\n// ─── Navigation ─────────────────────────────\nfunction startInstruments() {\n  phase = 'instrument';\n  instrumentIdx = 0;\n  render();\n}\nfunction startQuiz() {\n  phase = 'quiz';\n  quizIdx = 0;\n  render();\n}\nfunction nextScreen() {\n  if (phase === 'instrument') {\n    if (instrumentIdx \u003c instruments.length - 1) {\n      instrumentIdx++;\n      render();\n    } else {\n      phase = 'quiz-intro';\n      render();\n    }\n  } else if (phase === 'quiz') {\n    if (quizIdx \u003c quizQuestions.length - 1) {\n      quizIdx++;\n      render();\n    } else {\n      phase = 'results';\n      render();\n    }\n  }\n}\n\n// ─── Confetti ───────────────────────────────\nfunction launchMiniConfetti() {\n  const btn = document.getElementById('checkBtn');\n  if (!btn) return;\n  const rect = btn.getBoundingClientRect();\n  const cx = rect.left + rect.width / 2;\n  const cy = rect.top + rect.height / 2;\n  const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];\n  const shapes = ['circle','square','triangle'];\n  for (let i = 0; i \u003c 35; i++) {\n    const el = document.createElement('div');\n    el.className = 'confetti-piece';\n    const c = colors[Math.floor(Math.random() * colors.length)];\n    const s = shapes[Math.floor(Math.random() * shapes.length)];\n    const size = 6 + Math.random() * 8;\n    el.style.width = size + 'px';\n    el.style.height = size + 'px';\n    el.style.left = cx + 'px';\n    el.style.top = cy + 'px';\n    if (s === 'circle') {\n      el.style.borderRadius = '50%';\n      el.style.background = c;\n    } else if (s === 'square') {\n      el.style.background = c;\n      el.style.borderRadius = '2px';\n    } else {\n
